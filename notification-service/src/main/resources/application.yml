spring:
  application:
    name: notification-service
  data:
    mongodb:
      username: othman
      password: pass
      host: localhost
      port: 27017
      database: notification-ms
      authentication-database: admin
  kafka:
    consumer:
      bootstrap-servers: localhost:9092
      group-id: paymentGroup,orderGroup
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: '*'
        spring.json.type.mapping: paymentConfirmation:com.freelance.notification.dtos.PaymentConfirmation,orderConfirmation:com.freelance.notification.dtos.OrderConfirmation
  config:
    import: optional:configserver:http://localhost:5000
server:
  port: 5012